name: Build Extension

on:
  push:
    branches: 
      - main
      - master
      - dev
      - 'fix-**'      # 支持 fix-xxx 格式的分支
      - 'fix/**'      # 支持 fix/xxx 格式的分支
      - 'feat-**'     # 支持 feat-xxx 格式的分支
      - 'feat/**'     # 支持 feat/xxx 格式的分支
      - 'hotfix-**'   # 支持 hotfix-xxx 格式的分支
      - 'hotfix/**'   # 支持 hotfix/xxx 格式的分支
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gemini-nexus/package-lock.json
        
    - name: Install dependencies
      working-directory: ./gemini-nexus
      run: npm ci
      
    - name: Build extension
      working-directory: ./gemini-nexus
      run: npm run build
      
    - name: Package extension
      working-directory: ./gemini-nexus
      run: |
        mkdir -p ../artifacts
        
        # 创建临时打包目录
        TEMP_DIR="../temp-package"
        mkdir -p "$TEMP_DIR"
        
        # 复制所有必要的文件和目录
        cp -r background "$TEMP_DIR/"
        cp -r content "$TEMP_DIR/"
        cp -r css "$TEMP_DIR/"
        cp -r lib "$TEMP_DIR/"
        cp -r services "$TEMP_DIR/"
        cp -r sidepanel "$TEMP_DIR/"
        cp -r sandbox "$TEMP_DIR/"
        cp -r dist "$TEMP_DIR/"
        cp logo.png "$TEMP_DIR/"
        cp manifest.json "$TEMP_DIR/"
        cp metadata.json "$TEMP_DIR/"
        
        # 打包成 ZIP（从临时目录内部打包，确保根目录正确）
        cd "$TEMP_DIR"
        zip -r ../artifacts/gemini-nexus-${{ github.sha }}.zip \
          background/ \
          content/ \
          css/ \
          lib/ \
          services/ \
          sidepanel/ \
          sandbox/ \
          dist/ \
          logo.png \
          manifest.json \
          metadata.json \
          -x "*.map" "*/.DS_Store"
        
        cd ..
        rm -rf "$TEMP_DIR"
        
        echo "✅ 打包完成: artifacts/gemini-nexus-${{ github.sha }}.zip"
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gemini-nexus-build-${{ github.sha }}
        path: artifacts/gemini-nexus-${{ github.sha }}.zip
        retention-days: 30
