name: Build Extension

on:
  push:
    branches: 
      - main
      - master
      - dev
      - 'fix-**'      # 支持 fix-xxx 格式的分支
      - 'fix/**'      # 支持 fix/xxx 格式的分支
      - 'feat-**'     # 支持 feat-xxx 格式的分支
      - 'feat/**'     # 支持 feat/xxx 格式的分支
      - 'hotfix-**'   # 支持 hotfix-xxx 格式的分支
      - 'hotfix/**'   # 支持 hotfix/xxx 格式的分支
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gemini-nexus/package-lock.json
        
    - name: Install dependencies
      working-directory: ./gemini-nexus
      run: npm ci
      
    - name: Build extension
      working-directory: ./gemini-nexus
      run: npm run build
      
    - name: Package extension
      working-directory: ./gemini-nexus
      run: |
        mkdir -p ../artifacts
        zip -r ../artifacts/gemini-nexus-${{ github.sha }}.zip \
          dist/ \
          background/ \
          content/ \
          css/ \
          lib/ \
          services/ \
          sidepanel/ \
          sandbox/ \
          logo.png \
          manifest.json \
          metadata.json \
          -x "*.map" "node_modules/*" ".git/*"
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gemini-nexus-build-${{ github.sha }}
        path: artifacts/gemini-nexus-${{ github.sha }}.zip
        retention-days: 30
